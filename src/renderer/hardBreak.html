<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlinkBreak - Take a Break</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000 !important;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      cursor: none;
    }
    
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 800px;
    }
    
    .icon {
      font-size: 6rem;
      margin-bottom: 2rem;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }
    
    h1 {
      font-size: 4rem;
      font-weight: bold;
      color: #4db8a8;
      margin-bottom: 1rem;
    }
    
    .subtitle {
      font-size: 2rem;
      color: #a0a0a0;
      margin-bottom: 3rem;
    }
    
    .timer {
      font-size: 8rem;
      font-weight: bold;
      color: #4db8a8;
      font-family: 'Courier New', monospace;
      margin: 3rem 0;
      text-shadow: 0 0 20px rgba(77, 184, 168, 0.5);
    }
    
    .tips {
      margin-top: 3rem;
      font-size: 1.5rem;
      color: #a0a0a0;
      line-height: 2.5;
    }
    
    .tip {
      margin: 1rem 0;
    }
    
    .footer {
      margin-top: 3rem;
      font-size: 1rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">👁️</div>
    <h1>Time for a Break!</h1>
    <p class="subtitle">Rest your eyes and relax</p>
    
    <div class="timer" id="timer">00:20</div>
    
    <div class="tips">
      <div class="tip">👀 Look at something 20 feet away</div>
      <div class="tip">😌 Blink slowly and relax your eyes</div>
      <div class="tip">🧘 Take deep breaths</div>
    </div>
    
    <div class="footer">Hard Mode - Screen locked until break completes</div>
  </div>
  
  <script>
    // Ensure black background
    document.body.style.backgroundColor = '#000000';
    document.documentElement.style.backgroundColor = '#000000';
    
    // Get duration from URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const duration = parseInt(urlParams.get('duration')) || 20;
    let timeLeft = duration;
    
    const timerElement = document.getElementById('timer');
    
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
    
    function updateTimer() {
      timerElement.textContent = formatTime(timeLeft);
      
      if (timeLeft > 0) {
        timeLeft--;
        setTimeout(updateTimer, 1000);
      }
    }
    
    // Start timer
    updateTimer();
    
    // Prevent all keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      return false;
    });
    
    // Prevent context menu
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      return false;
    });
  </script>
</body>
</html>
