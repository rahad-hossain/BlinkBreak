<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlinkBreak Reminder</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      height: 250px;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    
    .popup {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1e1e1e 0%, #2a2a2a 100%);
      border: 2px solid #4db8a8;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    .header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    
    .icon {
      font-size: 2.5rem;
      flex-shrink: 0;
    }
    
    .content {
      flex: 1;
    }
    
    h3 {
      font-size: 1.25rem;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    
    .description {
      font-size: 0.875rem;
      color: #a0a0a0;
      line-height: 1.4;
    }
    
    .tips {
      margin: 1rem 0;
      font-size: 0.875rem;
      color: #a0a0a0;
      line-height: 1.8;
    }
    
    .buttons {
      display: flex;
      gap: 0.75rem;
      margin-top: auto;
    }
    
    button {
      flex: 1;
      padding: 0.75rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .take-break {
      background: #4db8a8;
      color: #1e1e1e;
    }
    
    .take-break:hover {
      background: #5cc9b8;
      transform: translateY(-1px);
    }
    
    .dismiss {
      background: #3a3a3a;
      color: #a0a0a0;
    }
    
    .dismiss:hover {
      background: #4a4a4a;
    }
  </style>
</head>
<body>
  <div class="popup">
    <div class="header">
      <div class="icon">👁️</div>
      <div class="content">
        <h3>Time for a Break!</h3>
        <p class="description">You've been working for a while. Take a moment to rest your eyes.</p>
      </div>
    </div>
    
    <div class="tips">
      • Look at something 20 feet away<br>
      • Blink slowly and relax
    </div>
    
    <div class="buttons">
      <button class="take-break" onclick="takeBreak()">Take Break</button>
      <button class="dismiss" onclick="dismiss()">Dismiss</button>
    </div>
  </div>
  
  <script>
    function takeBreak() {
      window.close();
    }
    
    function dismiss() {
      window.close();
    }
    
    // Auto-close after duration
    const urlParams = new URLSearchParams(window.location.search);
    const duration = parseInt(urlParams.get('duration')) || 20;
    
    setTimeout(() => {
      window.close();
    }, duration * 1000);
  </script>
</body>
</html>
