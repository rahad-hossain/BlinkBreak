appId: com.blinkbreak.app
productName: BlinkBreak
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
extraResources:
  - from: build/logo.ico
    to: logo.ico
win:
  target:
    - nsis
    - portable
  icon: build/logo.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
