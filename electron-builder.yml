appId: com.blinkbreak.app
productName: BlinkBreak
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/**
extraResources:
  - from: build/logo.ico
    to: logo.ico
  - from: helpers
    to: helpers
  - from: native/bin/BlinkTaskbar.dll
    to: native/BlinkTaskbar.dll
win:
  target:
    - nsis
    - portable
  icon: build/logo.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
